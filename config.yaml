corpus:
  dir: distribution/corpus

parsing:
  # Supported options: pdfplumber, upstage_api
  backend: upstage_api
  output_dir: parsed_corpus
  force: false

  pdfplumber:
    extract_tables: true

  upstage_api:
    url: https://api.upstage.ai/v1/document-digitization
    model: document-parse
    ocr: auto
    output_formats:
      - markdown
    timeout_seconds: 300

chunking:
  max_chunk_chars: 1200
  overlap_chars: 200
  min_chunk_chars: 80
  include_table_chunks: true
  output_filename: chunks.jsonl

indexing:
  dense:
    provider: upstage
    url: https://api.upstage.ai/v1/solar/embeddings
    passage_model: solar-embedding-1-large-passage
    query_model: solar-embedding-1-large-query
    dimension: 4096
    batch_size: 16
    sleep_seconds: 1
    max_retries: 5
    retry_base_seconds: 2
    force: false
    faiss_filename: dense.faiss
    metadata_filename: dense_metadata.jsonl
    embeddings_filename: dense_embeddings.npy

llm:
  model: solar-mini
  query_analysis:
    enabled: true
    temperature: 0
    max_tokens: 512
  draft_generation:
    enabled: true
    temperature: 0
    max_tokens: 768
  final_generation:
    temperature: 0
    max_tokens: 768
